name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Clean install
        run: pnpm install --frozen-lockfile
      - name: Full validation
        run: pnpm validate
      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: apps/web/dist
      - name: Upload API build
        uses: actions/upload-artifact@v6
        with:
          name: api-dist
          path: apps/api/dist
