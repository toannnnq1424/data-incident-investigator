name: Release validation

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable 40-character commit SHA; leave blank for current main
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  release-validation:
    name: validate selected commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Select immutable commit
        id: target
        shell: bash
        env:
          DEFAULT_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            printf 'Release validation must be dispatched from refs/heads/main; received %s.\n' "$DISPATCH_REF" >&2
            exit 1
          fi

          if [[ -z "$REQUESTED_SHA" ]]; then
            target_sha="${DEFAULT_SHA,,}"
            selection="current main"
          elif [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            target_sha="${REQUESTED_SHA,,}"
            selection="requested"
          else
            printf 'commit_sha must be blank or exactly 40 hexadecimal characters.\n' >&2
            exit 1
          fi

          printf 'Selected %s commit: %s\n' "$selection" "$target_sha"
          printf 'sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          resolved_sha="$(git rev-parse HEAD)"
          printf 'Resolved validation commit: %s\n' "$resolved_sha"
          if [[ "$resolved_sha" != "$EXPECTED_SHA" ]]; then
            printf 'Expected validation commit %s but checked out %s.\n' "$EXPECTED_SHA" "$resolved_sha" >&2
            exit 1
          fi
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Clean install
        run: pnpm install --frozen-lockfile
      - name: Full validation
        run: pnpm validate
